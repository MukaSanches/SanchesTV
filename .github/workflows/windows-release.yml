name: Windows Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: sanchestv-windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SanchesTV.sln

      - name: Build
        run: dotnet build SanchesTV.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/SanchesTV.Tests/SanchesTV.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish Windows x64
        run: >
          dotnet publish src/SanchesTV.Desktop/SanchesTV.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/publish

      - name: Install 7-Zip
        shell: pwsh
        run: choco install 7zip --no-progress -y

      - name: Prepare verified media runtime
        shell: pwsh
        run: .\.github\scripts\prepare-media-runtime.ps1 -PublishDir ".\artifacts\publish"

      - name: Prepare verified media toolchain
        shell: pwsh
        run: .\.github\scripts\prepare-v7-tools.ps1 -PublishDir ".\artifacts\publish"

      - name: Verify bundled media files
        shell: pwsh
        run: |
          if (-not (Test-Path ".\artifacts\publish\libmpv-2.dll")) { throw "libmpv-2.dll missing" }
          if (-not (Test-Path ".\artifacts\publish\runtime\ffmpeg\ffmpeg.exe")) { throw "ffmpeg.exe missing" }
          if (-not (Test-Path ".\artifacts\publish\runtime\ffmpeg\ffprobe.exe")) { throw "ffprobe.exe missing" }
          if (-not (Test-Path ".\artifacts\publish\runtime\mediamtx\mediamtx.exe")) { throw "mediamtx.exe missing" }
          if (-not (Get-ChildItem ".\artifacts\publish\runtime\tsduck" -Recurse -Filter "tsanalyze.exe" -ErrorAction SilentlyContinue)) { throw "TSDuck tsanalyze.exe missing" }
          if (-not (Get-ChildItem ".\artifacts\publish\runtime\ccextractor" -Recurse -Filter "ccextractorwinfull.exe" -ErrorAction SilentlyContinue)) { throw "CCExtractor missing" }
          if (-not (Test-Path ".\artifacts\publish\runtime\whisper\whisper-cli.exe")) { throw "whisper-cli.exe missing" }
          if (-not (Test-Path ".\artifacts\publish\runtime\whisper\ggml-tiny.bin")) { throw "Whisper model missing" }
          if (-not (Get-ChildItem ".\artifacts\publish\runtime\realesrgan" -Recurse -Filter "realesrgan-ncnn-vulkan.exe" -ErrorAction SilentlyContinue)) { throw "Real-ESRGAN missing" }
          if (-not (Get-ChildItem ".\artifacts\publish\runtime\rife" -Recurse -Filter "rife-ncnn-vulkan.exe" -ErrorAction SilentlyContinue)) { throw "RIFE missing" }
          if (-not (Get-ChildItem ".\artifacts\publish\runtime\hyperion" -Recurse -Include "hyperiond.exe","Hyperion.exe" -ErrorAction SilentlyContinue)) { throw "Hyperion missing" }

      - name: Published app self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\artifacts\publish\SanchesTV.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            $diag = ".\artifacts\publish\selftest-error.txt"
            if (Test-Path $diag) { Get-Content $diag | Write-Host }
            throw "Self-test failed with exit code $($p.ExitCode)"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ".\installer\SanchesTV.iss"
          if (-not (Test-Path ".\artifacts\installer\SanchesTV-Setup-8.2.0-x64.exe")) {
            throw "Installer was not generated."
          }

      - name: Installer clean-install smoke test
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "SanchesTV-CleanInstall"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $installer = Resolve-Path ".\artifacts\installer\SanchesTV-Setup-8.2.0-x64.exe"
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer returned $($process.ExitCode)" }

          $exe = Join-Path $installDir "SanchesTV.exe"
          if (-not (Test-Path $exe)) { throw "Installed executable not found." }

          $selfTest = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) {
            $diag = Join-Path $installDir "selftest-error.txt"
            if (Test-Path $diag) { Get-Content $diag | Write-Host }
            throw "Installed self-test failed with exit code $($selfTest.ExitCode)"
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller not found." }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller returned $($uninstall.ExitCode)" }

      - name: SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\artifacts\installer\SanchesTV-Setup-8.2.0-x64.exe" -Algorithm SHA256).Hash
          "$hash  SanchesTV-Setup-8.2.0-x64.exe" | Out-File ".\artifacts\installer\SanchesTV-Setup-8.2.0-x64.exe.sha256" -Encoding ascii
          Write-Host "SHA256=$hash"

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Build Velopack installer and delta feed
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".\artifacts\velopack" | Out-Null
          vpk pack -u SanchesTV -v 8.2.0 -o ".\artifacts\velopack" -p ".\artifacts\publish" -e SanchesTV.exe --packTitle "SanchesTV" --packAuthors "SanchesTV"
          if ($LASTEXITCODE -ne 0) { throw "Velopack packaging failed." }
          if (-not (Test-Path ".\artifacts\velopack\SanchesTV-win-Setup.exe")) { throw "Velopack Setup missing." }
          if (-not (Test-Path ".\artifacts\velopack\releases.win.json")) { throw "Velopack release feed missing." }
          if (-not (Get-ChildItem ".\artifacts\velopack" -Filter "*-full.nupkg")) { throw "Velopack full package missing." }

      - name: Velopack clean-install smoke test
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "SanchesTV-VelopackInstall"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          $setup = Resolve-Path ".\artifacts\velopack\SanchesTV-win-Setup.exe"
          $install = Start-Process -FilePath $setup -ArgumentList "--silent","--installto",$installDir -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Velopack installer returned $($install.ExitCode)" }

          $exe = Join-Path $installDir "current\SanchesTV.exe"
          if (-not (Test-Path $exe)) { throw "Velopack installed executable not found." }

          $selfTest = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) {
            $diag = Join-Path (Split-Path $exe -Parent) "selftest-error.txt"
            if (Test-Path $diag) { Get-Content $diag | Write-Host }
            throw "Velopack installed self-test failed with exit code $($selfTest.ExitCode)"
          }

          $update = Join-Path $installDir "Update.exe"
          if (-not (Test-Path $update)) { throw "Velopack Update.exe missing." }
          $uninstall = Start-Process -FilePath $update -ArgumentList "--uninstall","--silent" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Velopack uninstaller returned $($uninstall.ExitCode)" }

      - name: SHA-256 Velopack installer
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\artifacts\velopack\SanchesTV-win-Setup.exe" -Algorithm SHA256).Hash
          "$hash  SanchesTV-win-Setup.exe" | Out-File ".\artifacts\velopack\SanchesTV-win-Setup.exe.sha256" -Encoding ascii
          Write-Host "VELOPACK_SHA256=$hash"

      - uses: actions/upload-artifact@v7
        with:
          name: SanchesTV-Setup-8.2.0-x64
          path: |
            artifacts/installer/SanchesTV-Setup-8.2.0-x64.exe
            artifacts/installer/SanchesTV-Setup-8.2.0-x64.exe.sha256
            artifacts/velopack/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = ".\artifacts\installer\SanchesTV-Setup-8.2.0-x64.exe"
          $sha = ".\artifacts\installer\SanchesTV-Setup-8.2.0-x64.exe.sha256"
          gh release view v8.2.0 --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v8.2.0 --target "$env:GITHUB_SHA" --title "SanchesTV 8.2.0" --notes "SanchesTV 8.2.0 Cinema OS Orchestrated para Windows x64. Adiciona orquestração durável local inspirada nos padrões do Netflix Conductor: workflows versionados, dependências, fork/join paralelo, persistência de estado, retomada, retries com backoff exponencial e jitter, timeout por tarefa e eventos de observabilidade. A sincronização do catálogo passa a usar recuperação automática sem colocar o orquestrador no caminho crítico do player. Preserva Playback Intelligence, failover libmpv/LibVLC, P2P, timeshift, EPG, gravação, Media Lab, MediaMTX, DLNA, TSDuck, CCExtractor, whisper.cpp offline, ONNX Runtime, FFmpeg avançado, telemetria local e Velopack. O pipeline valida build, testes, runtimes, self-test, instalação limpa Inno e instalação limpa Velopack."
          }
          gh release upload v8.2.0 $exe $sha --clobber --repo "$env:GITHUB_REPOSITORY"
          Get-ChildItem ".\artifacts\velopack" -File | ForEach-Object {
            gh release upload v8.2.0 $_.FullName --clobber --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $($_.Name)" }
          }

name: Windows Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SanchesTV.sln

      - name: Build
        run: dotnet build SanchesTV.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/SanchesTV.Tests/SanchesTV.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish Windows x64
        run: >
          dotnet publish src/SanchesTV.Desktop/SanchesTV.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/publish

      - name: Published app self-test
        shell: pwsh
        run: |
          & ".\artifacts\publish\SanchesTV.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Self-test failed with exit code $LASTEXITCODE" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ".\installer\SanchesTV.iss"
          if (-not (Test-Path ".\artifacts\installer\SanchesTV-Setup-1.0.0-x64.exe")) {
            throw "Installer was not generated."
          }

      - name: Installer clean-install smoke test
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "SanchesTV-CleanInstall"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $installer = Resolve-Path ".\artifacts\installer\SanchesTV-Setup-1.0.0-x64.exe"
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer returned $($process.ExitCode)" }

          $exe = Join-Path $installDir "SanchesTV.exe"
          if (-not (Test-Path $exe)) { throw "Installed executable not found." }

          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Installed self-test failed with exit code $LASTEXITCODE" }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller not found." }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller returned $($uninstall.ExitCode)" }

      - name: SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\artifacts\installer\SanchesTV-Setup-1.0.0-x64.exe" -Algorithm SHA256).Hash
          "$hash  SanchesTV-Setup-1.0.0-x64.exe" | Out-File ".\artifacts\installer\SanchesTV-Setup-1.0.0-x64.exe.sha256" -Encoding ascii
          Write-Host "SHA256=$hash"

      - uses: actions/upload-artifact@v4
        with:
          name: SanchesTV-Setup-1.0.0-x64
          path: |
            artifacts/installer/SanchesTV-Setup-1.0.0-x64.exe
            artifacts/installer/SanchesTV-Setup-1.0.0-x64.exe.sha256
          if-no-files-found: error

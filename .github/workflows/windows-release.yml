name: Windows Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore SanchesTV.sln
      - name: Build
        run: dotnet build SanchesTV.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/SanchesTV.Tests/SanchesTV.Tests.csproj -c Release --no-build
      - name: Publish Windows x64
        run: dotnet publish src/SanchesTV.Desktop/SanchesTV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/SanchesTV
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path artifacts/SanchesTV/* -DestinationPath artifacts/SanchesTV-1.0.0-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SanchesTV-1.0.0-win-x64
          path: artifacts/SanchesTV-1.0.0-win-x64.zip

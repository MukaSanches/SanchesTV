name: Quality

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Core and persistence tests
        run: dotnet test tests/SanchesTV.Tests/SanchesTV.Tests.csproj -c Release --logger "trx;LogFileName=core.trx"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-test-results
          path: tests/SanchesTV.Tests/TestResults/*.trx

  desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Validate packaging PowerShell syntax
        shell: pwsh
        run: |
          $paths = @(".github/scripts/prepare-media-runtime.ps1", ".github/scripts/prepare-v7-tools.ps1")
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$path : $_" }
              throw "Invalid PowerShell packaging script: $path"
            }
          }
      - name: Restore
        run: dotnet restore SanchesTV.sln
      - name: Compile native Windows application
        run: dotnet build SanchesTV.sln -c Release --no-restore
      - name: Tests on Windows
        run: dotnet test tests/SanchesTV.Tests/SanchesTV.Tests.csproj -c Release --no-build
      - name: Capture native Cinema Hub with demonstration data
        shell: pwsh
        run: |
          $exe = Resolve-Path "src/SanchesTV.Desktop/bin/Release/net10.0-windows/SanchesTV.exe"
          $output = Join-Path $env:RUNNER_TEMP "cinema-hub-captures"
          $process = Start-Process -FilePath $exe -ArgumentList "--capture-cinema-hub",$output -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path "$output/error.txt") { Get-Content "$output/error.txt" }
            throw "Native WPF capture failed with exit code $($process.ExitCode)"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: cinema-hub-native-captures
          path: |
            ${{ runner.temp }}/cinema-hub-captures/*.png
            ${{ runner.temp }}/cinema-hub-captures/capture-info.json
          if-no-files-found: error
